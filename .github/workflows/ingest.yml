name: ingest

# Runs daily rather than weekly, on purpose:
#
#  - The CFTC release is Friday 15:30 ET, but ingest is idempotent (upsert keyed on
#    report_date + market_code + cohort), so a daily run costs nothing and removes
#    the single point of failure of a once-a-week cron. It also picks up CFTC
#    revisions to already-published weeks, which do happen.
#  - The snapshot-only sources (OpenRouter pricing) have NO backfill. For those a
#    run that does not happen is a hole in the dataset forever. Daily is the
#    minimum defensible cadence.
#
# The daily cost is small because the CFTC pull is INCREMENTAL by default: it asks
# only for reports on or after (latest stored - 56 days), which is ~1 MB rather
# than the ~900 MB a full-history pull of all seven datasets would be. The window
# deliberately OVERLAPS what is already stored so revisions are picked up.
#
# 20:15 UTC == 16:15 ET during EDT, 15:15 ET during EST. The Friday CFTC file lands
# at 15:30 ET, so during EST the Friday data arrives on Saturday's run. That is
# fine, and it is why the board shows data age rather than assuming freshness.

on:
  schedule:
    - cron: "15 20 * * *"
  workflow_dispatch:
    inputs:
      backfill:
        description: "Pull full history instead of the incremental window"
        type: boolean
        default: false
  push:
    paths:
      - "sources/**"
      - "lib/**"
      - "scripts/ingest.py"
      - ".github/workflows/ingest.yml"

permissions:
  contents: write

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # Field maps are the highest-risk part of this repo: a wrong CFTC column
      # name does not raise, it silently produces a plausible chart of the wrong
      # number. This asks Socrata for every column the spec names (a renamed
      # column returns HTTP 400 naming it) and then checks the accounting
      # identities, which is what catches a name that exists but means something
      # else. Cheap, and it fails before anything is written.
      - name: Verify CFTC field maps against the live API
        run: python -m scripts.verify_spec --rows 2000

      - name: Pull all sources
        run: |
          if [ "${{ inputs.backfill }}" = "true" ]; then
            python -m scripts.ingest --backfill
          else
            python -m scripts.ingest
          fi

      - name: Run tests against the committed data
        run: python -m pytest -q

      - name: Commit any new data
        run: |
          git config user.name  "watchboard-bot"
          git config user.email "watchboard-bot@users.noreply.github.com"
          git add data/
          # Writes are byte-deterministic within a pyarrow version, so a day with
          # no new report produces an identical file and an empty diff. That is
          # why this commits ~52 times a year rather than 365, and why nothing
          # timestamped is written into data/.
          if git diff --staged --quiet; then
            echo "no data changes"
          else
            git commit -m "data: ingest $(date -u +%Y-%m-%d)"
            git push
          fi
