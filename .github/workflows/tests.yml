name: tests

# Runs on every push. The snapshot workflow runs the suite too, but only on its own
# schedule and on pushes touching a few paths, so this is the one that covers a change
# anywhere else.
#
# ~2 seconds, no network, and no dependence on data/: the suite reads the 5 MB
# committed slice in tests/fixtures/fixture.sqlite. That is what lets CI tell you a
# causality rule broke without fetching a single row.
#
# What it actually guards, all of which this repo has regressed on at least once:
#   - the OI residual is rounding, not an unpublished non-reportable spread
#   - sum(net) == 0 holds to a tolerance, and an exact test is the bug
#   - concentration ratios divide by the side total, not by open interest
#   - every ranking is causal, proved by truncation, with non-causal controls
#     asserted to FAIL so the check cannot rot into a tautology
#   - no dashboard query ranks in SQL, and none reads an archive table
#   - a source we may not redistribute has no committed artefact, and a source we
#     cannot re-fetch does -- both asserted by asking the ignore rules directly

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Tests
        run: python -m pytest -q

      # Cheap, and it is the check that catches the failure mode with no symptom:
      # a CFTC column that still exists but now means something else. Allowed to
      # fail the run without blocking the suite's verdict, since it is the only
      # step here that depends on a third-party endpoint being up.
      - name: Verify CFTC field maps against the live API
        continue-on-error: true
        run: python -m scripts.verify_spec --rows 1000
