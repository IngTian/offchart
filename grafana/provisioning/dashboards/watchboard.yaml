# Dashboards come from committed JSON. allowUiUpdates is false on purpose: it makes
# the file authoritative, so a dashboard cannot drift away from what is in git and a
# test that lints the JSON is linting what actually renders.
apiVersion: 1

providers:
  - name: watchboard
    orgId: 1
    folder: Watchboard
    type: file
    disableDeletion: false
    allowUiUpdates: false
    options:
      path: /repo/grafana/dashboards
      foldersFromFilesStructure: false
